    <style>
        * {
            box-sizing: border-box;
        }

        html {
            font-size: 20px;
        }

   body {
    margin: 0;
    min-height: 100vh;
    background-image: url('background.jfif'); /* Fixed: Added url() and changed extension to .jfif */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
}

        /* Header */
        .header1 {
            color: white;
            background-color: #B2AC88;
            border-radius: 30px;
            width: 70%;
            margin: 25px auto;
            padding: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }

        .header1 h1 {
            margin: 10px;
        }

        /* Main area */
        main {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: stretch;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Subject cards */
        .subjects {
            background-color: rgba(255, 255, 255, 0.94);
            border-radius: 25px;
            padding: 30px 45px;
            width: 450px;
            min-height: 500px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        .subjects h2 {
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }

        .subjects li {
            margin: 20px 0;
            padding-left: 5px;
        }

        .subjects a {
            color: #1261c9;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .subjects a:hover {
            color: #e06b00;
            text-decoration: underline;
            font-size: 1.05em;
        }

        /* Mathematics card */
        .math {
            border: 4px solid #4aa3df;
        }

        .math h2 {
            color: #14558a;
        }

        /* Geography card */
        .geo {
            border: 4px solid #70a878;
        }

        .geo h2 {
            color: #286034;
        }

        /* Footer */
        footer {
            background-color: #060b14;
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            margin-top: 30px;
        }

        footer a {
            color: white;
        }

        /* Mobile */
        @media (max-width: 800px) {
            main {
                flex-direction: column;
                align-items: center;
            }

            .subjects {
                width: 90%;
            }

            .header1 {
                width: 90%;
            }
        }
    </style>
