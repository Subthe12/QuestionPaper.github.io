<html>
    <head>
        <title>
            Server down!
        </title>
        <style>
            body {
    /* Replace with your image link or local path */
    background-image: url('Hold_up_wait_a_minute.png');
    
    /* Prevents the image from repeating like a tile */
    background-repeat: no-repeat;
    
    /* Centers the image perfectly on the screen */
    background-position: center center;
    
    /* Makes the image scale to completely fill the screen */
    background-size: cover;
    
    /* Keeps the background fixed in place when scrolling */
    background-attachment: fixed;
    
    /* Fallback color in case the image fails to load */
    background-color: #0f172a; 
        </style>
    </head>
    <body>
        <h1 align="center">
            Oops, Server is down! Please try later
        </h1>
    </body>
</html>
